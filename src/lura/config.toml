[Server.Settings]
port=22223
_host='192.168.178.25'

[Styler.Settings]
style = 'GreenElf'

[ModelView.Quickmark]
model_name='quickmark'
tab_prefix={command = 'q'}
view_prefix={'|^own' = '<c-.>'}
position={QuickmarkTab= 'D|R'}
widget_map={mark = {w = 'Label', p = '0x0x1x1'}}

[ModelView.Outline]
model_name='outline'
view_kind='TreeView'
tab_prefix={command = 'o'}
position={OutlineTab= 'D|L'}
view_prefix={'|^own' = '<c-.>'}

[ModelView.Bookmark]
model_name='bookmark'
tab_prefix={command = 'b'}
view_prefix={'|^own' = '<c-.>'}
position={BookmarkTab= 'D|R'}

[ModelView.Bookmark.widget_map]
id = {w =  'Label', p = '0x0x1x1'}
text = {w = 'TextEdit', p = '1x0x1x1'}

[ModelView.Annotation]
locator='annotation'
model_name='annotation'
tab_prefix={command = 'a'}
view_prefix={'|^own' = '<c-.>'}
position={AnnotationTab= 'D|R'}

[ModelView.Annotation.widget_map]
id = {w =  'Label', p = '0x0x1x1', n = 'function'}
text = {w = 'TextEdit', p = '1x0x1x1'}

[ModelView.Metadata]
model_name='metadata'
tab_prefix={command = 'm'}
position={MetadataTab= 'D|R'}
view_prefix={'|^own' = '<c-.>'}
include={field = ['title', 'author', 'year', 'bibkey']}

[ModelView.Metadata.widget_map]
field = {w = 'Label', p = '0x0x1x1', title=true}
value = {w = 'TextEdit', p = '1x0x1x1'}

[DBTables.State]
uid='id'
name='state'
props=['hasStates']

[DBTables.Quickmark]
uid='id'
name='quickmark'
props=['canQuickmark']

[DBTables.Bookmark]
uid='id'
name='bookmark'
props=['canBookmark']

[DBTables.Annotation]
uid='id'
name='annotation'
props=['canAnnotate']

[DBTables.Metadata]
uid='id'
name='metadata'
row_model=true
autocreate=true
props=['hasMetadata']

[Picky.Settings]
base = 'https://github.com'
folder = '~/.config/lura/picky'

[[Picky.Picks]]
pick = 'aotabekov91/ohu'
subdir = [
	'src/ohu/files',
	'src/ohu/pdf_fitz',
	'src/ohu/server_zmq',
	]

[[Picky.Picks]]
pick = 'aotabekov91/janilai'
subdir = [
	'src/qt/green_elf',
	'src/qt/db_tables',
	'src/qt/model_view',
	# 'src/card', # todo reimplementing with vimo in mind
	# 'src/plug/qt/plugs/umay_plug', # todo
	]

[View]
zoomFactor = 0.1
scaleFactor = 1.0
continuousMode = true
layoutMode = 'SinglePage' 

[View.Item]
xresol = 72
yresol = 72
rotation = 0
proxyPadding =  0
viewportPadding = 0

[View.Layout]
pageSpacing = 0 

[ImageView]
continuousMode = false

[FitzView]
tileSize =  1024 #todo
paperColor = 'gray' #todo
useTiling =  false #todo
trimMargins = false #todo
invertColors = false #todo
decorateLinks = true
decoratePages = false
devicePixelRatio = 1.0
drawMode = 'DefaultMode'
annotationOverlay = true
convertToGrayscale = false #todo
keepObsoletePixmaps = true
copyToClipboardModifiers = 1 #todo

[FitzView.Layout]
pageSpacing = 5
padding = [5, 5, 5, 5] #todo

[OverlayView]
blur_color=[125, 125, 125, 200]

[FitzView.State]
scale=true
position=true
