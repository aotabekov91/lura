[Styler.Settings]
style = 'GreenElf'

[TableModel.General]
uid='id'
view_mode='table'
attach_mode='model'
check_props=['canLocate']

[TableModel.tables.Annotation]
table_name='Annotation'
check_props=['canAnnotate']

[TableModel.tables.Bookmark]
table_name='Bookmark'

[TableModel.tables.Quickmark]
table_name='Quickmark'

