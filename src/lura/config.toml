[Server.Settings]
port=22223

[Styler.Settings]
style = 'GreenElf'

[Views.Quickmark]
model_name='quickmark'
tab_prefix={command = 'q'}
view_prefix={'|^own' = '<c-.>'}
position={QuickmarkTab= 'D|R'}
widget_map={mark = {w = 'Label', p = '0x0x1x1'}}

[Views.Bookmark]
model_name='bookmark'
tab_prefix={command = 'b'}
view_prefix={'|^own' = '<c-.>'}
position={BookmarkTab= 'D|R'}

[Views.Bookmark.widget_map]
id = {w =  'Label', p = '0x0x1x1', n = 'BookmarkField'}
text = {w = 'TextEdit', p = '1x0x1x1'}

[Views.Metadata]
model_name='metadata'
tab_prefix={command = 'm'}
position={MetadataTab= 'D|R'}
view_prefix={'|^own' = '<c-.>'}
include={field = ['title', 'author', 'year', 'bibkey']}

[Views.Metadata.widget_map]
field = {w = 'Label', p = '0x0x1x1', n='MetadataField'}
value = {w = 'TextEdit', p = '1x0x1x1'}

[DBTables.Quickmark]
uid='id'
name='quickmark'
props=['canQuickmark']

[DBTables.Bookmark]
uid='id'
name='bookmark'
props=['canBookmark']

[DBTables.Metadata]
uid='id'
name='metadata'
row_model=true
autocreate=true
props=['hasMetadata']

