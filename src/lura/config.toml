[Picky.Settings]
base = 'https://github.com'
folder = '~/.config/lura/picky'

[[Picky.Picks]]
pick = 'aotabekov91/ohu'
subdir = [
	'src/ohu/files',
	'src/ohu/pdf_fitz',
	]

[[Picky.Picks]]
pick = 'aotabekov91/lura_plugins'
subdir = [
	# 'src/qt/table_view',
	# 'src/plug/qt/plugs/umay_plug', # todo
	# 'src/outline', # todo
	# 'src/card', # todo reimplementing with vimo in mind
	'src/qt/stater',
	'src/qt/green_elf',
	'src/qt/table_model',
	]

[View]
zoomFactor = 0.1
scaleFactor = 1.0
continuousMode = true
layoutMode = 'SinglePage' 
scaleMode = 'FitToWindowWidth' 

[View.Item]
xresol = 72
yresol = 72
rotation = 0
proxyPadding =  0
viewportPadding = 0

[View.Layout]
pageSpacing = 0 

[ImageView]
continuousMode = false

[FitzView]
tileSize =  1024
paperColor = 'gray'
useTiling =  false
trimMargins = false
invertColors = false
decorateLinks = true
decoratePages = false
devicePixelRatio = 1.0
drawMode = 'DefaultMode'
annotationOverlay = true
convertToGrayscale = false
keepObsoletePixmaps = true
copyToClipboardModifiers = 1

[FitzView.Item]
yresol=72

[FitzView.Layout]
pageSpacing = 3 

[FitzView.Annotate.colors.highlight]
t = {color = '#EEFC5E', name = 'Term'}  
d = {color = '#0FF0FC', name = 'Data'}
f = {color = '#A4DE02', name = 'Focus'}
q = {color = '#1AA7EC', name = 'Question'}
l = {color = '#D3D3D3', name = 'Literature'}
m = {color = '#DE73FF', name = 'Methodology'}

[FitzView.Annotate.colors.underline]
m = {color = '#63C5DA', name = 'Main'}
i = {color = 'red', name = 'Important'}  
l = {color = 'orange', name = 'Lookup'}

[FitzView.Annotate.colors.caret]
i = {color = '#800000', name = 'Important'}

[FitzView.Annotate.colors.text]
s = {color = '#EEFC5E', name = 'Summary'}  

[FitzView.Annotate.colors.strike-out]
e = {color = 'red', name = 'Error'}  
