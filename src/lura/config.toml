[Picky.Settings]
base = 'https://github.com'
folder = '~/.config/lura/picky'

[[Picky.Picks]]
pick = 'aotabekov91/ohu'
subdir = [
	'src/ohu/files',
	'src/ohu/pdf_fitz',
	'src/ohu/server_zmq',
	]

[[Picky.Picks]]
pick = 'aotabekov91/lura_plugins'
subdir = [
	# 'src/plug/qt/plugs/umay_plug', # todo
	# 'src/card', # todo reimplementing with vimo in mind
	'src/qt/views',
	'src/qt/stater',
	'src/qt/outline',
	'src/qt/green_elf',
	'src/qt/db_tables',
	]

[View]
zoomFactor = 0.1
scaleFactor = 1.0
continuousMode = true
layoutMode = 'SinglePage' 
scaleMode = 'FitToWindowWidth' 

[View.Item]
xresol = 72
yresol = 72
rotation = 0
proxyPadding =  0
viewportPadding = 0

[View.Layout]
pageSpacing = 0 

[ImageView]
continuousMode = false

[FitzView]
tileSize =  1024
paperColor = 'gray'
useTiling =  false
trimMargins = false
invertColors = false
decorateLinks = true
decoratePages = false
devicePixelRatio = 1.0
drawMode = 'DefaultMode'
annotationOverlay = true
convertToGrayscale = false
keepObsoletePixmaps = true
copyToClipboardModifiers = 1

