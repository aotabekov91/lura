[ZMQClient.Settings]
router_port=22223
publisher_port=22224
host='tcp://192.168.178.25'

[Styleman.Settings]
style = 'GreenElf'

[Modeman.Settings]
base = 'https://github.com'
folder = '~/.config/lura/picky'

[[Modeman.Picks]]
pick = 'aotabekov91/janilai'
subdir = [
	# 'src/janilai/table',
	# 'src/janilai/ctrlp',
	'src/janilai/green_elf',
	# 'src/janilai/model_view',
	]

# [[Modeman.Picks]]
# pick = 'aotabekov91/sainan'
# subdir = [
# 	'src/sainan/plugs/client/czmq',
# 	]


[ModelView.Quickmark]
want='attach'
model_name='quickmark'
tab_prefix={command = 'q'}
view_prefix={'|^' = '<c-.>'}
position={QuickmarkTab= 'D|R'}
widget_map={mark = {w = 'Label', p = '0x0x1x1'}}

[ModelView.Outline]
want='attach'
model_name='outline'
view_kind='TreeView'
tab_prefix={command = 'o'}
position={OutlineTab= 'D|L'}
view_prefix={'|^' = '<c-.>'}

[ModelView.Bookmark]
want='attach'
model_name='bookmark'
tab_prefix={command = 'b'}
view_prefix={'|^' = '<c-.>'}
position={BookmarkTab= 'D|R'}

[ModelView.Bookmark.widget_map]
id = {w =  'Label', p = '0x0x1x1'}
text = {w = 'TextEdit', p = '1x0x1x1'}

[ModelView.Annotation]
want='attach'
locator='annotation'
model_name='annotation'
tab_prefix={command = 'a'}
view_prefix={'|^' = '<c-.>'}
position={AnnotationTab= 'D|R'}

[ModelView.Annotation.widget_map]
id = {w =  'Label', p = '0x0x1x1', n = 'function'}
text = {w = 'TextEdit', p = '1x0x1x1'}

[ModelView.Metadata]
want='attach'
model_name='metadata'
tab_prefix={command = 'm'}
position={MetadataTab= 'D|R'}
view_prefix={'|^' = '<c-.>'}
include={field = ['title', 'author', 'year', 'bibkey']}

[ModelView.Metadata.widget_map]
field = {w = 'Label', p = '0x0x1x1', title=true}
value = {w = 'TextEdit', p = '1x0x1x1'}

[Table.State]
uid='id'
name='state'
want='attach'
props=['hasStates']

[Table.Quickmark]
uid='id'
want='attach'
name='quickmark'
props=['canQuickmark']

[Table.Bookmark]
uid='id'
want='attach'
name='bookmark'
props=['canBookmark']

[Table.Annotation]
uid='id'
want='attach'
name='annotation'
props=['canAnnotate']

[Table.Metadata]
uid='id'
want='attach'
name='metadata'
row_model=true
autocreate=true
props=['hasMetadata']

[View]
zoomFactor = 0.1
scaleFactor = 1.0
continuousMode = true
layoutMode = 'SinglePage' 

[View.Item]
xresol = 72
yresol = 72
rotation = 0
proxyPadding =  0
viewportPadding = 0

[View.Layout]
pageSpacing = 0 

[FitzView]
tileSize =  1024 #todo
paperColor = 'gray' #todo
useTiling =  false #todo
trimMargins = false #todo
invertColors = false
decorateLinks = true
decoratePages = false
devicePixelRatio = 1.0
drawMode = 'DefaultMode'
annotationOverlay = true
convertToGrayScale = true
keepObsoletePixmaps = true
copyToClipboardModifiers = 1 #todo

[FitzView.Layout]
pageSpacing = 5
padding = [5, 5, 5, 5] #todo

[OverlayView]
blur_color=[125, 125, 125, 200]

[FitzView.State]
scale=true
position=true

[ImageQtView]
continuousMode = false
