[Server.Settings]
router=22223
publisher=22224
host='tcp://192.168.178.25'

[Styler.Settings]
style = 'GreenElf'

[ModelView.Pomodoro]
want='set'
model_name='pomodoro'
tab_prefix={command = 'p'}
position={PomodoroTab= 'D|R'}
view_prefix={'|^own' = '<c-.>'}

[ModelView.Pomodoro.widget_map]
task = {w = 'Label', p = '0x0x1x1', title=true}
worked = {w = 'Label', p = '1x0x1x1'}
timestamp = {w = 'Label', p = '2x0x1x1'}

[ModelView.Task]
want='set'
model_name='task'
position={TaskTab= 'D|R'}
tab_prefix={command = 't'}
view_prefix={'|^own' = '<c-.>'}

[ModelView.Task.widget_map]
id = {w = 'Label', p = '0x0x1x1'}
task = {w = 'TextEdit', p = '1x0x1x1'}
status = {w = 'Label', p = '2x0x1x1', title = true}

[ModelView.Quickmark]
want='attach'
model_name='quickmark'
tab_prefix={command = 'q'}
view_prefix={'|^own' = '<c-.>'}
position={QuickmarkTab= 'D|R'}
widget_map={mark = {w = 'Label', p = '0x0x1x1'}}

[ModelView.Outline]
want='attach'
model_name='outline'
view_kind='TreeView'
tab_prefix={command = 'o'}
position={OutlineTab= 'D|L'}
view_prefix={'|^own' = '<c-.>'}

[ModelView.Bookmark]
want='attach'
model_name='bookmark'
tab_prefix={command = 'b'}
view_prefix={'|^own' = '<c-.>'}
position={BookmarkTab= 'D|R'}

[ModelView.Bookmark.widget_map]
id = {w =  'Label', p = '0x0x1x1'}
text = {w = 'TextEdit', p = '1x0x1x1'}

[ModelView.Annotation]
want='attach'
locator='annotation'
model_name='annotation'
tab_prefix={command = 'a'}
view_prefix={'|^own' = '<c-.>'}
position={AnnotationTab= 'D|R'}

[ModelView.Annotation.widget_map]
id = {w =  'Label', p = '0x0x1x1', n = 'function'}
text = {w = 'TextEdit', p = '1x0x1x1'}

[ModelView.Metadata]
want='attach'
model_name='metadata'
tab_prefix={command = 'm'}
position={MetadataTab= 'D|R'}
view_prefix={'|^own' = '<c-.>'}
include={field = ['title', 'author', 'year', 'bibkey']}

[ModelView.Metadata.widget_map]
field = {w = 'Label', p = '0x0x1x1', title=true}
value = {w = 'TextEdit', p = '1x0x1x1'}

[DBTables.Task]
uid='id'
want='set'
name='task'

[DBTables.Event]
uid='id'
want='set'
name='event'

[DBTables.Pomodoro]
uid='id'
want='set'
name='pomodoro'

[DBTables.State]
uid='id'
name='state'
want='attach'
props=['hasStates']

[DBTables.Quickmark]
uid='id'
want='attach'
name='quickmark'
props=['canQuickmark']

[DBTables.Bookmark]
uid='id'
want='attach'
name='bookmark'
props=['canBookmark']

[DBTables.Annotation]
uid='id'
want='attach'
name='annotation'
props=['canAnnotate']

[DBTables.Metadata]
uid='id'
want='attach'
name='metadata'
row_model=true
autocreate=true
props=['hasMetadata']

[Picky.Settings]
base = 'https://github.com'
folder = '~/.config/lura/picky'

[[Picky.Picks]]
pick = 'aotabekov91/ohu'
subdir = [
	'src/ohu/files',
	'src/ohu/image_qt',
	'src/ohu/pdf_fitz',
	'src/ohu/kalendar',
	'src/ohu/server_zmq',
	]

[[Picky.Picks]]
pick = 'aotabekov91/janilai'
subdir = [
	# 'src/janilai/card',
	'src/janilai/task',
	'src/janilai/ctrlp',
	'src/janilai/event',
	'src/janilai/pomodoro',
	'src/janilai/db_tables',
	'src/janilai/green_elf',
	'src/janilai/model_view',
	'src/janilai/word_lookup',
	# 'src/plug/qt/plugs/umay_plug', # todo
	]

[View]
zoomFactor = 0.1
scaleFactor = 1.0
continuousMode = true
layoutMode = 'SinglePage' 

[View.Item]
xresol = 72
yresol = 72
rotation = 0
proxyPadding =  0
viewportPadding = 0

[View.Layout]
pageSpacing = 0 

[FitzView]
tileSize =  1024 #todo
paperColor = 'gray' #todo
useTiling =  false #todo
trimMargins = false #todo
invertColors = false #todo
decorateLinks = true
decoratePages = false
devicePixelRatio = 1.0
drawMode = 'DefaultMode'
annotationOverlay = true
convertToGrayscale = false #todo
keepObsoletePixmaps = true
copyToClipboardModifiers = 1 #todo

[FitzView.Layout]
pageSpacing = 5
padding = [5, 5, 5, 5] #todo

[OverlayView]
blur_color=[125, 125, 125, 200]

[FitzView.State]
scale=true
position=true

[ImageQtView]
continuousMode = false
