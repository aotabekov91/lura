[View]
zoomFactor = 0.1
scaleFactor = 1.0
continuousMode = true
layoutMode = 'SinglePage' 

[View.Item]
xresol = 72
yresol = 72
rotation = 0
proxyPadding =  0
viewportPadding = 0

[View.Layout]
pageSpacing = 0 

[FitzView]
convertToGrayScale = false

tileSize =  1024 #todo
paperColor = 'gray' #todo
useTiling =  false #todo
trimMargins = false #todo
devicePixelRatio = 1.0
drawMode = 'DefaultMode'
keepObsoletePixmaps = true

[FitzView.Layout]
pageSpacing = 5
padding = [0, 0, 0, 0] #todo
