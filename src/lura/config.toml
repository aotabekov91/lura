[View]
zoomFactor = 0.1
scaleFactor = 1.0
continuousMode = true
layoutMode = 'SinglePage' 

[View.Item]
xresol = 72
yresol = 72
rotation = 0
proxyPadding =  0
viewportPadding = 0

[View.Layout]
pageSpacing = 0 

[FitzView]
convertToGrayScale = false

tileSize =  1024 #todo
paperColor = 'gray' #todo
useTiling =  false #todo
trimMargins = false #todo
invertColors = false
decorateLinks = true
decoratePages = false
devicePixelRatio = 1.0
drawMode = 'DefaultMode'
annotationOverlay = true
keepObsoletePixmaps = true
copyToClipboardModifiers = 1 #todo

[FitzView.Layout]
pageSpacing = 5
padding = [5, 5, 5, 5] #todo

[OverlayView]
blur_color=[125, 125, 125, 200]

[FitzView.State]
scale=true
position=true

[ImageQtView]
continuousMode = false
