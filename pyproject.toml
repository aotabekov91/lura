[tool.poetry]
name = "lura"
version = "0.0.1"
readme = "README.md"
description = "A viewer"
authors = ["A O <adhambek.otabekov.post@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.9"
pymupdf = {version="==1.24.1"}
#gizmo = {path = "/home/adam/code/gizmo", extras=["qt"]}

[tool.poetry.scripts]
lura = "lura.main:run"

[tool.poetry.group.dev.dependencies]
pytest = "^6"
pytest-qt = '*'
pytest-bdd = '*'
pytest-mock = '*'
pytest-benchmark = '*'
pytest-instafail = '*'

[tool.pytest.ini_options]
pythonpath="src"
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
filterwarnings = "ignore"

[tool.mypy]
follow_imports= "skip"
strict_optional = false
files = ["src", "tests"]
show_column_numbers = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
